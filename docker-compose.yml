services:
  db:
    image: postgres:16
    container_name: nhg-manabi-db
    environment:
      POSTGRES_DB: nhg_manabi
      POSTGRES_USER: nhg_manabi
      POSTGRES_PASSWORD: nhg_manabi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhg_manabi -d nhg_manabi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: nhg-manabi-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://nhg_manabi:nhg_manabi@db:5432/nhg_manabi
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5180,http://localhost:5180
      DEFAULT_DAVID_PASSWORD: "214423"
      API_DOCS: "1"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      EXAM_ASSETS_DIR: /app/exam_assets
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./import_data:/app/import_data:ro
      - ./exam_assets:/app/exam_assets:ro
    restart: unless-stopped

volumes:
  postgres_data:
    name: nhg-manabi_postgres
