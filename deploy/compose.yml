name: nhg-manabi

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nhg_manabi
      POSTGRES_USER: nhg_manabi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhg_manabi -d nhg_manabi"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://nhg_manabi:${POSTGRES_PASSWORD}@db:5432/nhg_manabi
      CORS_ORIGINS: https://jpn.manabi.cc,https://admin.manabi.cc
      DEFAULT_DAVID_PASSWORD: ${DEFAULT_DAVID_PASSWORD:-}
      # 库里还没有管理员时，用这两个值创建后台种子管理员（david 只是 C 端账号）。
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # T-028 注册发信：.env 提供 RESEND_API_KEY / MAIL_FROM；APP_BASE_URL 用于邮件链接域名
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://jpn.manabi.cc}
      EXAM_ASSETS_DIR: /data/assets
      EXAM_DATA_DIR: /data/normalized
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - /opt/nhg-manabi/assets:/data/assets:ro
      - ./normalized:/data/normalized:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 768m
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  postgres:
    name: nhg-manabi_postgres
